global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'lotto-api'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/api/metrics'
    # Add authentication header if metrics endpoint is protected
    # authorization:
    #   credentials: 'Bearer <your-token>'
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/loki/api/v1/metrics'

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    metrics_path: '/metrics'
