services:
  lotto-master-db:
    image: postgres:17-alpine
    container_name: lotto-master-db
    environment:
      POSTGRES_DB: ${MASTER_DB_NAME:-lotto_master_db}
      POSTGRES_USER: ${MASTER_DB_USER:-lotto_master_user}
      POSTGRES_PASSWORD: ${MASTER_DB_PASSWORD:-lotto_master_password}
    ports:
      - '${MASTER_DB_PORT:-5432}:5432'
    volumes:
      - lotto-master-db-data:/var/lib/postgresql/data
      - ./seeds/master:/docker-entrypoint-initdb.d
    networks:
      - lotto-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${MASTER_DB_USER:-lotto_master_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  lotto-settlements-db:
    image: postgres:17-alpine
    container_name: lotto-settlements-db
    environment:
      POSTGRES_DB: ${SETTLEMENT_DB_NAME:-lotto_settlement_db}
      POSTGRES_USER: ${SETTLEMENT_DB_USER:-lotto_settlement_user}
      POSTGRES_PASSWORD: ${SETTLEMENT_DB_PASSWORD:-lotto_settlement_password}
    ports:
      - '${SETTLEMENT_DB_PORT:-5433}:5432'
    volumes:
      - lotto-settlements-db-data:/var/lib/postgresql/data
      - ./seeds/settlements:/docker-entrypoint-initdb.d
    networks:
      - lotto-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${SETTLEMENT_DB_USER:-lotto_settlement_user}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  lotto-master-adminer:
    image: adminer
    container_name: lotto-master-adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: lotto-master-db
      ADMINER_DESIGN: ngeeann
    ports:
      - ${ADMINER_PORT:-8080}:8080
    networks:
      - lotto-network
    depends_on:
      lotto-master-db:
        condition: service_healthy

  lotto-redis:
    image: redis:7-alpine
    container_name: lotto-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - lotto-redis-data:/data
    networks:
      - lotto-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis123', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  lotto-redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: lotto-redis-commander
    platform: linux/amd64
    environment:
      - REDIS_HOSTS=local:lotto-redis:6379:0:${REDIS_PASSWORD:-redis123}
      - HTTP_USER=${REDIS_CMD_USER:-admin}
      - HTTP_PASSWORD=${REDIS_CMD_PASSWORD:-admin123}
    ports:
      - '${REDIS_CMD_PORT:-8081}:8081'
    networks:
      - lotto-network
    depends_on:
      lotto-redis:
        condition: service_healthy

  lotto-prometheus:
    image: prom/prometheus:latest
    container_name: lotto-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - lotto-prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    networks:
      - lotto-network

  lotto-loki:
    image: grafana/loki:latest
    container_name: lotto-loki
    user: '0:0'
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - lotto-loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '${GRAFANA_LOKI_PORT:-3100}:3100'
    networks:
      - lotto-network

  lotto-promtail:
    image: grafana/promtail:latest
    container_name: lotto-promtail
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - lotto-network

  lotto-grafana:
    image: grafana/grafana:latest
    container_name: lotto-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - lotto-grafana-data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3100}:3000'
    networks:
      - lotto-network
    depends_on:
      lotto-prometheus:
        condition: service_started
      lotto-loki:
        condition: service_started

networks:
  lotto-network:
    driver: bridge

volumes:
  lotto-master-db-data:
  lotto-settlements-db-data:
  lotto-redis-data:
  lotto-prometheus-data:
  lotto-loki-data:
  lotto-grafana-data:
